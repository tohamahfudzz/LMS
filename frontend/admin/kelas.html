<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Kelola Kelas - Admin LMS</title>
</head>
<body>

    <header>
        <h1>Kelola Kelas</h1>
        <p id="welcomeText">Memuat...</p>
        <button type="button" id="logoutButton">Keluar</button>
    </header>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="kelas.html">Kelas</a>
                <a href="tahun-ajaran.html">Tahun Ajaran</a>
        <a href="pengguna.html">Pengguna</a>
        <a href="anggota-kelas.html">Anggota Kelas</a>
    </nav>

    <main>
        <section>
            <h2>Buat Kelas Baru</h2>
            <div id="kelasMessage" role="alert" aria-live="polite" hidden></div>

            <form id="createKelasForm" novalidate>
                <div>
                    <label for="namaKelas">Nama Kelas</label>
                    <input
                        type="text"
                        id="namaKelas"
                        required
                        maxlength="100"
                        placeholder="Contoh: Pemrograman Web"
                        autocomplete="off"
                    >
                </div>
                                <div>
                    <label for="kelasTahunAjaran">Tahun Ajaran</label>
                    <select id="kelasTahunAjaran">
                        <option value="">-- Belum diatur --</option>
                    </select>
                </div>
                <div>
                    <label for="kelasSemester">Semester</label>
                    <select id="kelasSemester">
                        <option value="">-- Belum diatur --</option>
                        <option value="ganjil">Ganjil</option>
                        <option value="genap">Genap</option>
                    </select>
                </div>
                <button type="submit" id="createKelasButton">Simpan Kelas</button>
            </form>
        </section>

        <section>
            <h2>Daftar Kelas</h2>
            <table>
                <thead>
                                       <tr>
                        <th>No</th>
                        <th>Nama Kelas</th>
                        <th>Tahun Ajaran</th>
                        <th>Semester</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="kelasTableBody">
                    <tr>
                        <td colspan="3">Memuat data...</td>
                    </tr>
                </tbody>
            </table>
        </section>
                <section id="aturTahunPanel" hidden>
            <h2>Atur Tahun Ajaran Kelas</h2>
            <p>Kelas: <strong id="aturKelasNama">-</strong></p>
            <div id="aturTahunMessage" role="alert" aria-live="polite" hidden></div>

            <form id="aturTahunForm" novalidate>
                <input type="hidden" id="aturIdKelas" value="">
                <div>
                    <label for="aturTahunAjaran">Tahun Ajaran</label>
                    <select id="aturTahunAjaran"></select>
                </div>
                <div>
                    <label for="aturSemester">Semester</label>
                    <select id="aturSemester">
                        <option value="">-- Belum diatur --</option>
                        <option value="ganjil">Ganjil</option>
                        <option value="genap">Genap</option>
                    </select>
                </div>
                <button type="submit" id="aturTahunSimpan">Simpan</button>
                <button type="button" id="aturTahunBatal">Batal</button>
            </form>
        </section>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/admin.js"></script>
     <script src="../assets/js/admin-kelas-tahun.js"></script>
</body>
</html>
