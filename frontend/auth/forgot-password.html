<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Lupa Kata Sandi - LMS</title>
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth-page">
    <main class="auth-page__main">
        <section class="auth-card">
            <h1>Lupa Kata Sandi</h1>
            <p>Masukkan email yang terdaftar untuk menerima kode pemulihan.</p>

            <div
                id="forgotPasswordMessage"
                class="auth-message"
                role="alert"
                aria-live="polite"
                hidden
            ></div>

            <form id="forgotPasswordForm" novalidate>
                <div class="auth-card__field">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        maxlength="255"
                    >
                </div>
                <button type="submit" id="forgotPasswordButton">Kirim Kode</button>
            </form>

            <a class="auth-card__link" href="../login.html">Kembali ke login</a>
        </section>
    </main>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth-reset.js"></script>
</body>
</html>
