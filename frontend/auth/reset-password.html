<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Atur Ulang Kata Sandi - LMS</title>
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth-page">
    <main class="auth-page__main">
        <section class="auth-card">
            <h1>Atur Ulang Kata Sandi</h1>
            <p>Masukkan kode pemulihan yang dikirim ke email Anda, lalu buat kata sandi baru.</p>

            <div
                id="resetPasswordMessage"
                class="auth-message"
                role="alert"
                aria-live="polite"
                hidden
            ></div>

            <form id="resetPasswordForm" novalidate>
                <div class="auth-card__field">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        maxlength="255"
                    >
                </div>
                <div class="auth-card__field">
                    <label for="token">Kode pemulihan</label>
                    <input
                        type="text"
                        id="token"
                        name="token"
                        autocomplete="one-time-code"
                        autocapitalize="characters"
                        spellcheck="false"
                        required
                        maxlength="12"
                    >
                </div>
                <div class="auth-card__field">
                    <label for="password_baru">Kata sandi baru</label>
                    <input
                        type="password"
                        id="password_baru"
                        name="password_baru"
                        autocomplete="new-password"
                        required
                        minlength="8"
                        maxlength="100"
                    >
                </div>
                <button type="submit" id="resetPasswordButton">Simpan Kata Sandi</button>
            </form>

            <a class="auth-card__link" href="forgot-password.html">Kirim ulang kode</a>
            <a class="auth-card__link" href="../login.html">Kembali ke login</a>
        </section>
    </main>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth-reset.js"></script>
</body>
</html>
