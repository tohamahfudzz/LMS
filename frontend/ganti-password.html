<!--
================================================================================
LOKASI FILE : frontend/ganti-password.html   (satu folder dengan login.html)
GUNA FILE   : Halaman yang dibuka dari tautan di email "ganti password".
              Menampilkan formulir password baru (diisi dua kali). Alamat halaman
              membawa token: ganti-password.html?token=...
              - Logika halaman : assets/js/ganti-password.js
              - Backend        : backend/api/profil/confirm_password_change.php
              Halaman ini sama untuk admin, pengajar, dan siswa.
================================================================================
-->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <!-- Token ada di alamat halaman; jangan bocor lewat header Referer. -->
    <meta name="referrer" content="no-referrer">
    <title>Ganti Password - LMS</title>
    <link rel="stylesheet" href="assets/css/kelas-detail.css">
</head>
<body>

    <main>
        <h1>Ganti Password</h1>

        <div id="gantiMessage" class="message" role="alert" aria-live="polite" hidden></div>

        <form id="gantiPasswordForm" novalidate>
            <div class="form-field">
                <label for="passwordBaru">Password baru</label>
                <input type="password" id="passwordBaru" name="password_baru" required
                    minlength="8" maxlength="72" autocomplete="new-password">
            </div>
            <div class="form-field">
                <label for="passwordUlang">Ulangi password baru</label>
                <input type="password" id="passwordUlang" name="password_ulang" required
                    minlength="8" maxlength="72" autocomplete="new-password">
            </div>
            <button type="submit" id="gantiPasswordButton">Simpan Password Baru</button>
        </form>
        <p><small>Password minimal 8 karakter.</small></p>
        <p><a href="login.html">Kembali ke halaman login</a></p>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/ganti-password.js"></script>
</body>
</html>
