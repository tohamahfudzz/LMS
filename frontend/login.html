LOKASI FILE : frontend/login.html
GUNA FILE   : Halaman login. Menampilkan pesan error/sukses dari backend
              langsung di halaman agar user paham (bukan hanya di Network).
================================================================================
-->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Login - LMS</title>
    <link rel="stylesheet" href="assets/css/auth.css">
    <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js"
    async
    defer>
</script>
</head>
<body class="auth-page">
    <!-- Cloudflare Turnstile CAPTCHA -->


    <main class="auth-page__main">
        <section class="auth-card">
            <h1>LMS — Login</h1>
            <p>Masukkan kode, password, dan pilih role.</p>

            <!-- Area pesan untuk user (error / sukses) -->
            <div
                id="loginMessage"
                class="auth-message"
                role="alert"
                aria-live="polite"
                hidden
            ></div>

            <form id="loginForm" novalidate>
                <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA"></div>
                <div class="auth-card__field">
                    <label for="kode">Kode</label>
                    <input
                        type="text"
                        id="kode"
                        name="kode"
                        autocomplete="username"
                        required
                        maxlength="20"
                        placeholder="Contoh: 7777"
                    >
                </div>
                <div class="auth-card__field">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                        minlength="4"
                        maxlength="100"
                    >
                </div>
                <a class="auth-card__link" href="auth/forgot-password.html">Lupa Kata Sandi?</a>
                <div class="auth-card__field">
                    <label for="role">Role</label>
                    <select id="role" name="role" required>
                        <option value="" disabled selected>Pilih role</option>
                        <option value="admin">Admin</option>
                        <option value="pengajar">Pengajar</option>
                        <option value="siswa">Siswa</option>
                    </select>
                </div>
                <button type="submit" id="loginButton">Masuk</button>
            </form>

            <hr>
            <p><small>
                Contoh akun:<br>
                Admin — kode <strong>7777</strong>, password <strong>admin</strong><br>
                Pengajar — kode <strong>4444</strong>, password <strong>pengajar</strong><br>
                Siswa — kode <strong>3333</strong>, password <strong>siswa</strong>
            </small></p>
        </section>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
