<!--
================================================================================
LOKASI FILE : frontend/siswa/kelas-detail.html
GUNA FILE   : Halaman satu kelas untuk siswa. Dua tab:
              - Aktivitas : feed card materi, tugas, dan kuis (terbaru di atas).
                            Setiap card membuka halamannya sendiri:
                              materi-detail.html, tugas-detail.html, kuis-detail.html.
                            (assets/js/siswa-kelas-feed.js)
              - Absensi   : assets/js/siswa-kelas-absensi.js
              Dibuka dari kelas.html dengan format:
                  kelas-detail.html?id_kelas=1
              Parameter opsional &tab=aktivitas|absensi.
              Header kelas : GET siswa/kelas/list.php (sekaligus cek siswa terdaftar)
              Tampilan memakai assets/css/kelas-detail.css dan kelas-feed.css.
================================================================================
-->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Kelas - Siswa LMS</title>
    <link rel="stylesheet" href="../assets/css/kelas-detail.css">
    <link rel="stylesheet" href="../assets/css/kelas-feed.css">
</head>
<body>

    <header>
        <h1 id="kelasTitle">Memuat kelas...</h1>
        <p id="welcomeText">Memuat...</p>
        <button type="button" id="logoutButton">Keluar</button>
    </header>

    <nav>
        <a href="kelas.html">Kembali ke daftar kelas</a>
    </nav>

    <main>
        <div id="kelasMessage" class="message" role="alert" aria-live="polite" hidden></div>

        <div id="kelasTabs" class="kelas-tabs" role="tablist" aria-label="Menu kelas">
            <button type="button" role="tab" id="tab-aktivitas" class="kelas-tabs__button"
                    data-tab="aktivitas" aria-controls="panel-aktivitas" aria-selected="false">Aktivitas</button>
            <button type="button" role="tab" id="tab-absensi" class="kelas-tabs__button"
                    data-tab="absensi" aria-controls="panel-absensi" aria-selected="false">Absensi</button>
        </div>

        <!-- ===================== TAB AKTIVITAS ===================== -->
        <section role="tabpanel" id="panel-aktivitas" class="kelas-panel" aria-labelledby="tab-aktivitas" hidden>
            <div id="feedMessage" class="message" role="alert" aria-live="polite" hidden></div>

            <div id="feedList">
                <p>Memuat aktivitas...</p>
            </div>
        </section>

        <!-- ===================== TAB ABSENSI ===================== -->
        <section role="tabpanel" id="panel-absensi" class="kelas-panel" aria-labelledby="tab-absensi" hidden>
            <section class="kelas-panel__section">
                <h2>Absensi</h2>
                <div id="absensiMessage" class="message" role="alert" aria-live="polite" hidden></div>

                <div class="table-scroll">
                    <table border="1" cellpadding="6" cellspacing="0">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Tanggal</th>
                                <th>Dibuka</th>
                                <th>Ditutup</th>
                                <th>Status Sesi</th>
                                <th>Kehadiran Saya</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="absensiTableBody">
                            <tr>
                                <td colspan="7">Memuat data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/siswa-common.js"></script>
    <script src="../assets/js/siswa-kelas-detail.js"></script>
    <script src="../assets/js/pengajar-kelas-download.js"></script>
    <script src="../assets/js/siswa-kelas-feed.js"></script>
    <script src="../assets/js/siswa-kelas-absensi.js"></script>
</body>
</html>
