<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Detail Materi - Siswa LMS</title>

<body>

    <header>

        <p id="welcomeText">Memuat...</p>

    <nav>

    <main>
        <div id="pageMessage" class="message" role="alert" aria-live="polite" hidden></div>

            <dl class="detail-list">

                <dt>Waktu upload</dt><dd id="dWaktu">-</dd>
                <dt>Materi</dt><dd id="dAksi">-</dd>
            </dl>
        </section>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/siswa-common.js"></script>
