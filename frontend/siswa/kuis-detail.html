<!--
================================================================================
LOKASI FILE : frontend/siswa/kuis-detail.html
GUNA FILE   : Halaman detail satu kuis (siswa): info kuis, status, nilai, dan
              tombol Kerjakan / Lanjutkan. Dibuka dari card kuis di kelas-detail.html:
                  kuis-detail.html?id_kuis=1&id_kelas=2
              Mengerjakan kuis tetap di kuis-kerjakan.html. Halaman ini ada supaya
              kuis TIDAK langsung dimulai hanya karena card diklik.
              Logika: assets/js/siswa-kuis-detail.js
================================================================================
-->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Detail Kuis - Siswa LMS</title>
    <link rel="stylesheet" href="../assets/css/kelas-detail.css">
    <link rel="stylesheet" href="../assets/css/kelas-feed.css">
</head>
<body>

    <header>
        <h1>Detail Kuis</h1>
        <p id="welcomeText">Memuat...</p>
        <button type="button" id="logoutButton">Keluar</button>
    </header>

    <nav>
        <a id="backToKelasLink" href="kelas.html">Kembali ke kelas</a>
    </nav>

    <main>
        <div id="pageMessage" class="message" role="alert" aria-live="polite" hidden></div>

        <section id="detailSection" hidden>
            <h2 id="dJudul">-</h2>
            <dl class="detail-list">
                <dt>Kelas</dt><dd id="dKelas">-</dd>
                <dt>Dibuat</dt><dd id="dDibuat">-</dd>
                <dt>Deskripsi</dt><dd id="dDeskripsi" class="detail-deskripsi">-</dd>
                <dt>Durasi</dt><dd id="dDurasi">-</dd>
                <dt>Jumlah soal</dt><dd id="dSoal">-</dd>
                <dt>Waktu mulai</dt><dd id="dMulai">-</dd>
                <dt>Waktu selesai</dt><dd id="dSelesai">-</dd>
                <dt>Ketersediaan</dt><dd id="dKetersediaan">-</dd>
                <dt>Status saya</dt><dd id="dStatus">-</dd>
                <dt>Nilai</dt><dd id="dNilai">-</dd>
                <dt>Aksi</dt><dd id="dAksi">-</dd>
            </dl>
            <p><small>Kuis hanya bisa dikerjakan satu kali. Waktu langsung berjalan setelah kuis dimulai.</small></p>
        </section>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/siswa-common.js"></script>
    <script src="../assets/js/siswa-kuis-detail.js"></script>
</body>
</html>
