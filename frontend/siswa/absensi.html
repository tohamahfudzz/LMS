<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Absensi - Siswa LMS</title>
</head>
<body>

    <header>
        <h1>Absensi</h1>
        <p id="welcomeText">Memuat...</p>
        <button type="button" id="logoutButton">Keluar</button>
    </header>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="kelas.html">Kelas</a>
        <a href="materi.html">Materi</a>
        <a href="tugas.html">Tugas</a>
        <a href="absensi.html">Absensi</a>
    </nav>

    <main>
        <section>
            <h2>Presensi Hadir</h2>
            <p>Masukkan ID sesi absensi yang dibuka pengajar, lalu konfirmasi kehadiran.</p>

            <div id="hadirMessage" role="alert" aria-live="polite" hidden
                 style="margin: 8px 0; padding: 10px; border: 1px solid #ccc;"></div>

            <form id="hadirForm" novalidate>
                <div>
                    <label for="idAbsensi">ID Absensi</label><br>
                    <input type="number" id="idAbsensi" min="1" required placeholder="Contoh: 5">
                </div>
                <br>
                <button type="submit" id="hadirButton">Saya Hadir</button>
            </form>
        </section>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/siswa-common.js"></script>
    <script src="../assets/js/siswa-absensi.js"></script>
</body>
</html>
