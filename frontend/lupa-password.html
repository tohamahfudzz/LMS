
<!--
================================================================================
LOKASI FILE : frontend/lupa-password.html   (satu folder dengan login.html)
GUNA FILE   : Halaman "Lupa password". Pengguna memasukkan KODE yang biasa dipakai
              untuk login, lalu tautan reset password dikirim ke email yang
              tersimpan di akunnya.
              Dibuka dari tautan "Lupa password?" di login.html.
              - Logika halaman : assets/js/lupa-password.js
              - Backend        : backend/api/auth/forgot_password.php
              Halaman ini sama untuk admin, pengajar, dan siswa.
================================================================================
-->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Lupa Password - LMS</title>
    <link rel="stylesheet" href="assets/css/kelas-detail.css">
</head>
<body>

    <main>
        <h1>Lupa Password</h1>
        <p>Masukkan kode yang biasa Anda pakai untuk login. Tautan untuk membuat password baru akan dikirim ke email yang tersimpan di akun Anda.</p>

        <div id="lupaMessage" class="message" role="alert" aria-live="polite" hidden></div>

        <form id="lupaPasswordForm" novalidate>
            <div class="form-field">
                <label for="lupaKode">Kode</label>
                <input type="text" id="lupaKode" name="kode" required maxlength="20"
                    autocomplete="username">
            </div>
            <button type="submit" id="lupaPasswordButton">Kirim Tautan Reset</button>
        </form>

        <p><small>Fitur ini hanya bisa dipakai oleh akun yang sudah mengisi email di halaman profil. Jika belum, hubungi administrator.</small></p>
        <p><a href="login.html">Kembali ke halaman login</a></p>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/lupa-password.js"></script>
</body>
</html>
