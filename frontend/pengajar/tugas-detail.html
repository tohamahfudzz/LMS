<!--
================================================================================
LOKASI FILE : frontend/pengajar/tugas-detail.html
GUNA FILE   : Halaman detail satu tugas (pengajar): info tugas, lampiran, tombol
              tutup pengumpulan, dan daftar pengumpulan siswa.
              Dibuka dari card tugas di kelas-detail.html:
                  tugas-detail.html?id_tugas=1&id_kelas=2
              Logika: assets/js/pengajar-tugas-detail.js
================================================================================
-->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Detail Tugas - Pengajar LMS</title>
    <link rel="stylesheet" href="../assets/css/kelas-detail.css">
    <link rel="stylesheet" href="../assets/css/kelas-feed.css">
</head>
<body>

    <header>
        <h1>Detail Tugas</h1>
        <p id="welcomeText">Memuat...</p>
        <button type="button" id="logoutButton">Keluar</button>
    </header>

    <nav>
        <a id="backToKelasLink" href="dashboard.html">Kembali ke kelas</a>
    </nav>

    <main>
        <div id="pageMessage" class="message" role="alert" aria-live="polite" hidden></div>

        <section id="detailSection" hidden>
            <h2 id="dJudul">-</h2>
            <dl class="detail-list">
                <dt>Kelas</dt><dd id="dKelas">-</dd>
                <dt>Dibuat</dt><dd id="dDibuat">-</dd>
                <dt>Waktu mulai</dt><dd id="dMulai">-</dd>
                <dt>Deadline</dt><dd id="dDeadline">-</dd>
                <dt>Status</dt><dd id="dStatus">-</dd>
                <dt>Deskripsi</dt><dd id="dDeskripsi" class="detail-deskripsi">-</dd>
                <dt>Lampiran</dt><dd id="dLampiran">-</dd>
                <dt>Aksi</dt><dd id="dAksi">-</dd>
            </dl>
        </section>

        <section id="submissionSection" hidden>
            <h2>Pengumpulan Tugas</h2>
            <p id="submissionStat">-</p>

            <div class="table-scroll">
                <table border="1" cellpadding="6" cellspacing="0">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Kode Siswa</th>
                            <th>Nama</th>
                            <th>Status</th>
                            <th>Waktu Kumpul</th>
                            <th>Jawaban Teks</th>
                            <th>File</th>
                        </tr>
                    </thead>
                    <tbody id="submissionTableBody">
                        <tr>
                            <td colspan="7">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/pengajar-common.js"></script>
    <script src="../assets/js/pengajar-kelas-download.js"></script>
    <script src="../assets/js/pengajar-tugas-detail.js"></script>
</body>
</html>
